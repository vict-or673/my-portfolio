<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Launcher</title>
  <style>
    :root {
      --bg-1: #070b14;
      --bg-2: #0d1324;
      --panel: rgba(14, 20, 35, 0.72);
      --stroke: rgba(255, 255, 255, 0.08);
      --text: #eaf0ff;
      --muted: rgba(234, 240, 255, 0.72);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(131, 56, 236, 0.28), transparent 30%),
        radial-gradient(circle at top right, rgba(0, 209, 255, 0.16), transparent 26%),
        radial-gradient(circle at bottom center, rgba(255, 0, 122, 0.16), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .launcher {
      width: min(920px, 100%);
      padding: 28px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .launcher::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 20%, transparent 80%, rgba(255,255,255,0.08));
      pointer-events: none;
      border-radius: inherit;
      opacity: 0.65;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.03);
    }

    .eyebrow .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5eff9b;
      box-shadow: 0 0 14px rgba(94, 255, 155, 0.9);
      animation: pulse 1.8s infinite ease-in-out;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.8vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 10px auto 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }

    .social-btn {
      position: relative;
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 22px 14px 18px;
      min-height: 180px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transform-style: preserve-3d;
      transition:
        transform 220ms ease,
        box-shadow 220ms ease,
        border-color 220ms ease,
        background 220ms ease,
        filter 220ms ease;
      overflow: hidden;
      outline: none;
    }

    .social-btn:hover {
      transform: translateY(-8px) rotateX(6deg) rotateY(-6deg) scale(1.01);
      border-color: color-mix(in srgb, var(--accent) 55%, white 15%);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 0 28px color-mix(in srgb, var(--accent) 38%, transparent);
    }

    .social-btn:active {
      transform: translateY(-3px) scale(0.98);
    }

    .social-btn:focus-visible {
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.15),
        0 0 0 6px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .social-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%);
      opacity: 0.9;
      pointer-events: none;
    }

    .social-btn::after {
      content: "";
      position: absolute;
      inset: auto -20% -55% -20%;
      height: 120px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.12));
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .icon-shell {
      width: 86px;
      height: 86px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 16px 28px rgba(0,0,0,0.25),
        0 0 22px color-mix(in srgb, var(--accent) 20%, transparent);
      position: relative;
      transform: translateZ(18px);
    }

    .icon-shell svg {
      width: 42px;
      height: 42px;
      display: block;
      fill: currentColor;
    }

    .label {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
      transform: translateZ(12px);
    }

    .handle {
      font-size: 0.8rem;
      color: rgba(234,240,255,0.7);
      transform: translateZ(10px);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.18) 35%, transparent 70%);
      animation: ripple 650ms ease-out;
      mix-blend-mode: screen;
    }

    .ig { --accent: #ff4ecd; }
    .fb { --accent: #4c7dff; }
    .tt { --accent: #00f2ea; }
    .x  { --accent: #f5f7ff; }

    .ig .icon-shell { color: #ff5ec8; }
    .fb .icon-shell { color: #7aa0ff; }
    .tt .icon-shell { color: #00f2ea; }
    .x  .icon-shell { color: #f5f7ff; }

    .ig { background: linear-gradient(180deg, rgba(255,78,205,0.15), rgba(255,255,255,0.04)); }
    .fb { background: linear-gradient(180deg, rgba(76,125,255,0.15), rgba(255,255,255,0.04)); }
    .tt { background: linear-gradient(180deg, rgba(0,242,234,0.12), rgba(255,255,255,0.04)); }
    .x  { background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04)); }

    @keyframes ripple {
      to {
        transform: scale(3.3);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    @media (max-width: 820px) {
      .launcher { padding: 22px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .social-btn { min-height: 164px; }
    }

    @media (max-width: 460px) {
      body { overflow: auto; }
      .wrap { padding: 16px; }
      .launcher { padding: 18px; border-radius: 22px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .social-btn { min-height: 146px; border-radius: 20px; }
      .icon-shell { width: 76px; height: 76px; border-radius: 24px; }
      .icon-shell svg { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main class="wrap">
    <section class="launcher" aria-label="Social media launcher">
      <div class="header">
        <div class="eyebrow"><span class="pulse"></span> social media panel</div>
        <h1>Launch your favorite apps</h1>
        <p>A futuristic social dashboard with responsive animated buttons, glowing brand effects, and click ripples.</p>
      </div>

      <div class="grid">
        <a class="social-btn ig" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram">
          <span class="icon-shell" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
            </svg>
          </span>
          <span class="label">Instagram</span>
          <span class="handle">IG</span>
        </a>

<a class="social-btn fb" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Open Facebook">          <span class="icon-shell" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M14 8.5V7.2c0-.8.5-1.2 1.4-1.2H17V3h-2.1C12.3 3 11 4.3 11 6.9v1.6H9v3h2V21h3v-9.5h2.6l.4-3H14z" fill="currentColor"/>
            </svg>
          </span>
          <span class="label">Facebook</span>
          <span class="handle">FB</span>
        </a>

        <a class="social-btn tt" href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" aria-label="Open TikTok">
          <span class="icon-shell" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M15.7 3c.4 2.5 1.9 4.1 4.3 4.4v3.1c-1.6.1-3.1-.3-4.3-1v5.5c0 3.7-3 6-6.3 6-3.2 0-5.8-2.6-5.8-5.8s2.6-5.8 5.8-5.8c.3 0 .6 0 .9.1v3.4c-.3-.1-.6-.2-.9-.2-1.4 0-2.6 1.2-2.6 2.6 0 1.5 1.2 2.7 2.7 2.7 1.6 0 3-1.2 3-3V3h3.2z" fill="currentColor"/>
            </svg>
          </span>
          <span class="label">TikTok</span>
          <span class="handle">TT</span>
        </a>

        <a class="social-btn x" href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="Open X">
          <span class="icon-shell" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M18.7 3H21l-6.9 7.9L22 21h-6.6l-5.2-6.4L4.6 21H2.3l7.4-8.5L2 3h6.8l4.7 5.8L18.7 3zm-1.2 16h1.9L8 4.9H6L17.5 19z" fill="currentColor"/>
            </svg>
          </span>
          <span class="label">X</span>
          <span class="handle">Twitter</span>
        </a>
      </div>

      <section class="posts-section">
        <h2>Latest Posts</h2>
        <div id="posts-container">
          <p>Loading posts...</p>
        </div>
      </section>

    </section>
  </main>

    <script>
  async function loadPosts() {
    const container = document.getElementById("posts-container");

    try {
      const response = await fetch("/api/posts");

      if (!response.ok) {
        throw new Error("Failed to load posts");
      }

      const posts = await response.json();

      if (posts.length === 0) {
        container.innerHTML = "<p>No posts yet.</p>";
        return;
      }

      container.innerHTML = posts.map(post => `
        <article class="post-card">
          <h3>${post.title}</h3>
          <p>${post.body || ""}</p>
          <div class="post-author">By ${post.author}</div>
        </article>
      `).join("");

    } catch (error) {
      console.error("Post loading error:", error);
      container.innerHTML = "<p>Could not load posts.</p>";
    }
  }

  loadPosts();
</script>

</body>
</html>
